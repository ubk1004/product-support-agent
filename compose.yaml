services:
  mongodb:
    image: docker.io/library/mongo:8.0.38-noble@sha256:52afee5c058069f3b4c1517eaf65a8326d9f58ce4ef4fd076043b8eab6905112
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    stop_grace_period: 30s
    command:
      - azurite
      - --blobHost
      - 0.0.0.0
      - --queueHost
      - 0.0.0.0
      - --location
      - /data
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
    volumes:
      - azurite_data:/data

  api:
    build:
      context: .
      dockerfile: Containerfile
    env_file:
      - .env
    environment:
      PRODUCT_SUPPORT_MONGODB_URI: mongodb://mongodb:27017
      PRODUCT_SUPPORT_MANIFEST_PATH: /app/docs/operations/phase-2-product-manifest-v1.json
      PRODUCT_SUPPORT_SOURCE_MAP_PATH: /app/docs/operations/phase-3-source-map-v1.json
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "__import__('urllib.request').request.urlopen('http://127.0.0.1:8000/healthz',timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Containerfile
    environment:
      PRODUCT_SUPPORT_API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mongodb_data:
  azurite_data:
