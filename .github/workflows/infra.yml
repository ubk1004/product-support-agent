name: Infrastructure

# Validate the Bicep for every environment on pull requests and pushes. Deploy only on a manual
# run from main, in two stages: `platform` (network, data, identity, optional Foundry and secret
# bootstrap) and then `workloads` (Container Apps and optional API Management) once the images
# for the chosen commit are in the private registry. Each run targets one GitHub environment,
# which holds that environment's Azure credentials and required reviewers.
on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/prepare_deployment.py"
      - ".github/workflows/infra.yml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "scripts/prepare_deployment.py"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (selects the parameter file and the GitHub environment).
        required: true
        default: dev
        type: choice
        options:
          - dev
          - tst
          - prd
      stage:
        description: platform first; workloads after the images are published.
        required: true
        default: platform
        type: choice
        options:
          - platform
          - workloads
      image-tag:
        description: Workloads stage only. Commit SHA of the images in ACR (defaults to this commit).
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}-${{ inputs.environment || 'validate' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and lint Bicep (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, tst, prd]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build Bicep and parameters
        env:
          PARAMETERS: infra/bicep/parameters/${{ matrix.environment }}.bicepparam
        run: |
          az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
          az bicep build-params --file "$PARAMETERS" --stdout > /dev/null

      - name: Lint Bicep
        run: az bicep lint --file infra/bicep/main.bicep

  what-if:
    name: Preview ${{ inputs.stage }} (${{ inputs.environment }})
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Prepare stage parameters and refuse placeholders
        id: prepare
        env:
          PARAMETERS: infra/bicep/parameters/${{ inputs.environment }}.bicepparam
          STAGE: ${{ inputs.stage }}
          IMAGE_TAG: ${{ inputs.image-tag || github.sha }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          DOCUMENTDB_ADMIN_PASSWORD: ${{ secrets.DOCUMENTDB_ADMIN_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy"
          az bicep build --file infra/bicep/main.bicep --outfile "$RUNNER_TEMP/deploy/main.json"
          az bicep build-params --file "$PARAMETERS" --outfile "$RUNNER_TEMP/deploy/compiled.json"
          python3 scripts/prepare_deployment.py --compiled "$RUNNER_TEMP/deploy/compiled.json" \
            --stage "$STAGE" --image-tag "$IMAGE_TAG" --registry "$ACR_NAME" \
            --output-dir "$RUNNER_TEMP/deploy" >> "$GITHUB_OUTPUT"

      - name: Sign in with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run subscription what-if
        env:
          LOCATION: ${{ steps.prepare.outputs.location }}
          HAS_SECURE: ${{ steps.prepare.outputs.secure_parameters }}
        run: |
          secure=()
          if [ "$HAS_SECURE" = "true" ]; then secure=(--parameters "@$RUNNER_TEMP/deploy/secure.parameters.json"); fi
          az deployment sub what-if --location "$LOCATION" \
            --template-file "$RUNNER_TEMP/deploy/main.json" \
            --parameters "@$RUNNER_TEMP/deploy/parameters.json" "${secure[@]}"

  deploy:
    name: Deploy ${{ inputs.stage }} (${{ inputs.environment }}, manual only)
    # Deploy only after a successful what-if for the same environment and stage.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && needs.what-if.result == 'success'
    needs:
      - validate
      - what-if
    runs-on: ubuntu-latest
    # API Management in VNet mode can take 45 minutes or more on first creation.
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Prepare stage parameters and refuse placeholders
        id: prepare
        env:
          PARAMETERS: infra/bicep/parameters/${{ inputs.environment }}.bicepparam
          STAGE: ${{ inputs.stage }}
          IMAGE_TAG: ${{ inputs.image-tag || github.sha }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          DOCUMENTDB_ADMIN_PASSWORD: ${{ secrets.DOCUMENTDB_ADMIN_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/deploy"
          az bicep build --file infra/bicep/main.bicep --outfile "$RUNNER_TEMP/deploy/main.json"
          az bicep build-params --file "$PARAMETERS" --outfile "$RUNNER_TEMP/deploy/compiled.json"
          python3 scripts/prepare_deployment.py --compiled "$RUNNER_TEMP/deploy/compiled.json" \
            --stage "$STAGE" --image-tag "$IMAGE_TAG" --registry "$ACR_NAME" \
            --output-dir "$RUNNER_TEMP/deploy" >> "$GITHUB_OUTPUT"

      - name: Sign in with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create or update the subscription deployment
        env:
          LOCATION: ${{ steps.prepare.outputs.location }}
          HAS_SECURE: ${{ steps.prepare.outputs.secure_parameters }}
          DEPLOYMENT_NAME: psa-${{ inputs.environment }}-${{ inputs.stage }}-${{ github.run_id }}
        run: |
          secure=()
          if [ "$HAS_SECURE" = "true" ]; then secure=(--parameters "@$RUNNER_TEMP/deploy/secure.parameters.json"); fi
          az deployment sub create --name "$DEPLOYMENT_NAME" --location "$LOCATION" \
            --template-file "$RUNNER_TEMP/deploy/main.json" \
            --parameters "@$RUNNER_TEMP/deploy/parameters.json" "${secure[@]}"

      - name: Show deployment outputs
        env:
          DEPLOYMENT_NAME: psa-${{ inputs.environment }}-${{ inputs.stage }}-${{ github.run_id }}
        run: az deployment sub show --name "$DEPLOYMENT_NAME" --query properties.outputs --output json
