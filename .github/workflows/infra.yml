name: Infrastructure

# Validate the Bicep for every environment, preview changes with what-if, and deploy only on a
# manual run. Deployment targets an environment with required reviewers.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (selects the parameter file and the GitHub environment).
        required: true
        default: dev
        type: choice
        options:
          - dev
          - tst
          - prd

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}-${{ inputs.environment || 'validate' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and lint Bicep (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, tst, prd]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build Bicep and parameters
        env:
          PARAMETERS: infra/bicep/parameters/${{ matrix.environment }}.bicepparam
        run: |
          az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
          az bicep build-params --file "$PARAMETERS" --stdout > /dev/null

      - name: Lint Bicep
        run: az bicep lint --file infra/bicep/main.bicep

  check-oidc:
    name: Check optional what-if credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      available: ${{ steps.credentials.outputs.available }}
    steps:
      - name: Record credential availability without exposing values
        id: credentials
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          if [[ -n "$AZURE_CLIENT_ID" && -n "$AZURE_TENANT_ID" && -n "$AZURE_SUBSCRIPTION_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::what-if skipped: OIDC secrets are unavailable to this workflow."
          fi

  what-if:
    name: Subscription what-if (${{ inputs.environment || 'dev' }})
    if: needs.check-oidc.outputs.available == 'true'
    needs:
      - validate
      - check-oidc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Sign in with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run subscription what-if
        env:
          PARAMETERS: infra/bicep/parameters/${{ inputs.environment || 'dev' }}.bicepparam
        run: >-
          az deployment sub what-if --location canadacentral
          --template-file infra/bicep/main.bicep --parameters "$PARAMETERS"

  deploy:
    name: Deploy infrastructure (${{ inputs.environment }}, manual only)
    # Deploy only after a successful what-if for the same environment.
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && needs.what-if.result == 'success'
    needs:
      - validate
      - what-if
    runs-on: ubuntu-latest
    # API Management in VNet mode can take 45 minutes or more on first creation.
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Refuse placeholder parameter values
        env:
          PARAMETERS: infra/bicep/parameters/${{ inputs.environment }}.bicepparam
        run: |
          if grep -nE "placeholder|<foundry-resource>|example\.invalid|containerapps-helloworld" "$PARAMETERS"; then
            echo "::error::replace the placeholder values above in $PARAMETERS before deploying"
            exit 1
          fi

      - name: Sign in with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create or update the subscription deployment
        env:
          PARAMETERS: infra/bicep/parameters/${{ inputs.environment }}.bicepparam
          DEPLOYMENT_NAME: psa-${{ inputs.environment }}-${{ github.run_id }}
        run: >-
          az deployment sub create --name "$DEPLOYMENT_NAME" --location canadacentral
          --template-file infra/bicep/main.bicep --parameters "$PARAMETERS"
