name: Application

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.13.9

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Run Python validation
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src/product_support_agent scripts
          uv run pytest
          uv run bandit -q -r src scripts
          uv run pip-audit --skip-editable

  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run frontend validation
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm audit --audit-level=high

  publish:
    name: Build and push images to ACR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - python
      - web
    runs-on: [self-hosted, linux, x64, dev-vnet]
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Sign in with OIDC
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: Build and push images
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --file Containerfile --tag "${ACR_NAME}.azurecr.io/product-support-api:${IMAGE_TAG}" .
          docker build --file apps/web/Containerfile --tag "${ACR_NAME}.azurecr.io/product-support-web:${IMAGE_TAG}" apps/web
          docker push "${ACR_NAME}.azurecr.io/product-support-api:${IMAGE_TAG}"
          docker push "${ACR_NAME}.azurecr.io/product-support-web:${IMAGE_TAG}"
          docker tag "${ACR_NAME}.azurecr.io/product-support-api:${IMAGE_TAG}" "${ACR_NAME}.azurecr.io/product-support-api:latest"
          docker tag "${ACR_NAME}.azurecr.io/product-support-web:${IMAGE_TAG}" "${ACR_NAME}.azurecr.io/product-support-web:latest"
          docker push "${ACR_NAME}.azurecr.io/product-support-api:latest"
          docker push "${ACR_NAME}.azurecr.io/product-support-web:latest"

  deploy:
    name: Deploy Container Apps (manual only)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in with OIDC
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update API and web Container Apps
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          API_CONTAINER_APP_NAME: ${{ vars.API_CONTAINER_APP_NAME }}
          WEB_CONTAINER_APP_NAME: ${{ vars.WEB_CONTAINER_APP_NAME }}
          IMAGE_TAG: latest
        run: |
          az containerapp update --resource-group "$RESOURCE_GROUP_NAME" --name "$API_CONTAINER_APP_NAME" --image "${ACR_NAME}.azurecr.io/product-support-api:${IMAGE_TAG}"
          az containerapp update --resource-group "$RESOURCE_GROUP_NAME" --name "$WEB_CONTAINER_APP_NAME" --image "${ACR_NAME}.azurecr.io/product-support-web:${IMAGE_TAG}"
