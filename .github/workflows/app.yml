name: Application

# Build, publish, and deploy the web app, the API, and the ingestion job (the agent runs inside
# the API). Images are tagged with the commit SHA and deployed by that tag, never by "latest".
#
# The container registry has public network access disabled, so publishing and deploying run on
# a self-hosted runner inside the virtual network, labelled `<environment>-vnet`.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment for publish and deploy.
        required: true
        default: dev
        type: choice
        options:
          - dev
          - tst
          - prd
      image-tag:
        description: Commit SHA of images already in ACR to deploy (defaults to this commit).
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      security-events: write

  build:
    name: Build images
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build API and web images
        run: |
          docker build --file Containerfile --tag product-support-api:ci .
          docker build --file apps/web/Containerfile --tag product-support-web:ci apps/web

      - name: Check images run as a non-root user
        run: |
          for image in product-support-api:ci product-support-web:ci; do
            user=$(docker image inspect --format '{{.Config.User}}' "$image")
            if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
              echo "::error::$image runs as root"
              exit 1
            fi
          done

  publish:
    name: Push images to ACR (${{ inputs.environment || 'dev' }})
    # Pushes to main publish to dev; a manual run can publish to any environment.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: [self-hosted, linux, x64, "${{ inputs.environment || 'dev' }}-vnet"]
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: Build and push images tagged with the commit SHA
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          registry="${ACR_NAME}.azurecr.io"
          docker build --file Containerfile --tag "${registry}/product-support-api:${IMAGE_TAG}" .
          docker build --file apps/web/Containerfile --tag "${registry}/product-support-web:${IMAGE_TAG}" apps/web
          docker push "${registry}/product-support-api:${IMAGE_TAG}"
          docker push "${registry}/product-support-web:${IMAGE_TAG}"

  deploy:
    name: Deploy Container Apps (${{ inputs.environment }}, manual only)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: publish
    # The image check reads the private registry, so it runs inside the virtual network too.
    runs-on: [self-hosted, linux, x64, "${{ inputs.environment }}-vnet"]
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update the API, web app, and ingestion job to one image tag
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          API_CONTAINER_APP_NAME: ${{ vars.API_CONTAINER_APP_NAME }}
          WEB_CONTAINER_APP_NAME: ${{ vars.WEB_CONTAINER_APP_NAME }}
          INGESTION_JOB_NAME: ${{ vars.INGESTION_JOB_NAME }}
          IMAGE_TAG: ${{ inputs.image-tag || github.sha }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image-tag must be a full 40-character commit SHA"
            exit 1
          fi
          registry="${ACR_NAME}.azurecr.io"
          for repository in product-support-api product-support-web; do
            if ! az acr manifest show --name "${registry}/${repository}:${IMAGE_TAG}" > /dev/null 2>&1; then
              echo "::error::${repository}:${IMAGE_TAG} is not in ${ACR_NAME}; run the publish job first"
              exit 1
            fi
          done
          az containerapp update --resource-group "$RESOURCE_GROUP_NAME" --name "$API_CONTAINER_APP_NAME" --image "${registry}/product-support-api:${IMAGE_TAG}"
          az containerapp update --resource-group "$RESOURCE_GROUP_NAME" --name "$WEB_CONTAINER_APP_NAME" --image "${registry}/product-support-web:${IMAGE_TAG}"
          az containerapp job update --resource-group "$RESOURCE_GROUP_NAME" --name "$INGESTION_JOB_NAME" --image "${registry}/product-support-api:${IMAGE_TAG}"

      - name: Check the API revision is healthy
        env:
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          API_CONTAINER_APP_NAME: ${{ vars.API_CONTAINER_APP_NAME }}
        run: |
          state=$(az containerapp show --resource-group "$RESOURCE_GROUP_NAME" --name "$API_CONTAINER_APP_NAME" --query "properties.runningStatus" --output tsv)
          echo "API running status: ${state}"
          if [ "$state" != "Running" ]; then
            echo "::error::the API Container App is not running"
            exit 1
          fi
