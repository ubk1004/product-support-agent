[project]
name = "product-support-agent"
version = "0.1.0"
description = "Local-first product support assistant backend"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10,<4",
    "azure-search-documents>=12,<13",
    "azure-storage-queue>=12.13,<13",
    "agent-framework-core==1.26.0",
    "agent-framework-openai==1.18.2",
    "defusedxml>=0.7.1,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
    "opentelemetry-instrumentation-httpx>=0.51b0,<1",
    "opentelemetry-sdk>=1.30,<2",
    "azure-monitor-opentelemetry-exporter>=1.0.0b40,<2",
    "pydantic-settings>=2.7,<3",
    "pymongo>=4.10,<5",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.34,<1",
    "opentelemetry-instrumentation-logging>=0.51b0,<1",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "pytest>=9.0.3,<10",
    "pyyaml>=6,<7",
    "ruff>=0.9,<1",
    "types-pyyaml>=6,<7",
    "types-defusedxml>=0.7,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: calls real Foundry or Azure AI Search (pre-authorized for the demo; run with -m live)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
packages = ["product_support_agent"]
